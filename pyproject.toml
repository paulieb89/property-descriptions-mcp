[project]
name = "property-descriptions-mcp"
version = "0.2.5"
description = "MCP server for UK property listing descriptions"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.4",
    "property-shared>=1.11.0",
    "httpx",
    "uvicorn[standard]",
]

[project.scripts]
property-descriptions = "property_descriptions_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/property_descriptions_mcp"]

[dependency-groups]
dev = [
    "tiktoken>=0.12.0",
]
